[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipqc-guardian"
version = "3.0.0"
description = "An auditable quality gate for organ-on-a-chip brightfield imaging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "timm>=1.0", "numpy>=1.26", "pandas>=2", "scikit-learn>=1.4", "Pillow>=10", "openpyxl>=3.1"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
