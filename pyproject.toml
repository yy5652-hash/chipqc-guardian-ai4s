[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipqc-guardian"
version = "0.1.0"
description = "Auditable image-only OOC chip quality baseline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "streamlit>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
